<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Performance Analyzer V2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .subject {
      display: grid;
      grid-template-columns: 1fr 120px;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .subject label {
      margin: 0;
    }

    .subject input {
      margin: 0;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 13px 18px;
      margin: 5px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #172033;
      color: white;
    }

    .secondary {
      background: #e7edf6;
      color: #172033;
    }

    .danger {
      background: #eeeeee;
      color: #333;
    }

    .results {
      display: none;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f4f7fb;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-number {
      font-size: 30px;
      font-weight: bold;
      margin-top: 8px;
    }
